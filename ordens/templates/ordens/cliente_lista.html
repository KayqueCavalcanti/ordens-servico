<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
</head>

<body>
    <h1>Clientes</h1>
    <p><a href="{% url 'ordens:cliente_novo' %}">+ Novo cliente</a></p>
    <ul>
        {% for cliente in clientes %}
        <li>
            <a href="{% url 'ordens:cliente_detalhe' cliente.pk %}">{{ cliente.nome }}</a>
            — {{ cliente.telefone }}
        </li>
        {% empty %}
        <li>Nenhum cliente cadastrado.</li>
        {% endfor %}
    </ul>
</body>

</html>
